$kind: http-request
name: 2.9 A review cannot be changed
description: A second review would let anyone inflate an agent's acceptance rate, so it is refused.
method: POST
url: "{{apiUrl}}/graphql"
order: 9000
body:
  type: json
  content: |-
    {
      "query": "mutation ($id: ID!) { reviewRun(input: { runId: $id, verdict: REJECTED }) { run { id } userErrors { field code message } } }",
      "variables": { "id": "{{s2RunId}}" }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const payload = pm.response.json().data.reviewRun;
      pm.test('The second review is a CONFLICT', function () {
          pm.expect(payload.run).to.be.null;
          pm.expect(payload.userErrors[0].code).to.eql('CONFLICT');
      });
