$kind: http-request
name: 8.2 Find the Damage Claim Assessor run
method: POST
url: "{{apiUrl}}/graphql"
order: 2000
body:
  type: json
  content: |-
    {
      "query": "query ($slug: String!) { agent(slug: $slug) { runs(first: 20) { edges { node { id } } } } }",
      "variables": { "slug": "claim-assessor" }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const started = JSON.parse(pm.collectionVariables.get('s8RunIds') || '[]');
      const mine = pm.response.json().data.agent.runs.edges.map(e => e.node.id).find(id => started.includes(id));
      pm.test('The Damage Claim Assessor picked up the claim', function () {
          pm.expect(mine, 'run id').to.be.a('string');
      });
      pm.collectionVariables.set('s8RunId', mine);
