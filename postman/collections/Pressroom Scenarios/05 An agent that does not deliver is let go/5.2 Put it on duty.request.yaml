$kind: http-request
name: 5.2 Put it on duty
method: POST
url: "{{apiUrl}}/graphql"
order: 2000
body:
  type: json
  content: |-
    {
      "query": "mutation ($id: ID!) { activateAgent(id: $id) { agent { status } userErrors { code message } } }",
      "variables": { "id": "{{s5AgentId}}" }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Agent is active', function () {
          pm.expect(pm.response.json().data.activateAgent.agent.status).to.eql('ACTIVE');
      });
      pm.collectionVariables.set('s5RunIds', '[]');
