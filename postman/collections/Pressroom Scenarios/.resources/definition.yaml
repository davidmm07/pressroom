scripts:
  - type: http:beforeRequest
    code: |-
      // Every request speaks JSON and names the operator, unless it sets its own.
      if (!pm.request.headers.has('Content-Type')) {
          pm.request.headers.add({ key: 'Content-Type', value: 'application/json' });
      }
      if (!pm.request.headers.has('X-Pressroom-Actor')) {
          pm.request.headers.add({ key: 'X-Pressroom-Actor', value: pm.environment.get('actor') });
      }
    language: text/javascript
  - type: http:afterResponse
    code: |-
      pm.test('[contract] No server error', function () {
          pm.expect(pm.response.code).to.be.below(500);
      });
      // The Postman CLI silently skips request files it cannot parse.
      // scripts/scenarios.sh checks every step number shows up here.
      console.log('step', pm.info.requestName.split(' ')[0]);
    language: text/javascript
