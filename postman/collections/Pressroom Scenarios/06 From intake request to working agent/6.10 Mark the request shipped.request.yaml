$kind: http-request
name: 6.10 Mark the request shipped
method: POST
url: "{{apiUrl}}/graphql"
order: 10000
body:
  type: json
  content: |-
    {
      "query": "mutation ($id: ID!, $agentId: ID) { moveOpportunity(id: $id, status: SHIPPED, agentId: $agentId) { opportunity { status title agent { name slug } } userErrors { code message } } }",
      "variables": { "id": "{{s6OpportunityId}}", "agentId": "{{s6AgentId}}" }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const o = pm.response.json().data.moveOpportunity.opportunity;
      pm.test('Shipped and linked to the agent doing the work', function () {
          pm.expect(o.status).to.eql('SHIPPED');
          pm.expect(o.agent.slug).to.eql(pm.collectionVariables.get('s6Slug'));
      });
      console.log('Outcome: "' + o.title + '" went from request to a working agent (' + o.agent.name + ') in one sitting.');
