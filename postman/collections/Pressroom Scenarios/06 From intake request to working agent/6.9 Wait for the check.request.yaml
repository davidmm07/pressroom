$kind: http-request
name: 6.9 Wait for the check
method: POST
url: "{{apiUrl}}/graphql"
order: 9000
body:
  type: json
  content: |-
    {
      "query": "query ($id: ID!) { run(id: $id) { status failureReason steps { kind toolName } } }",
      "variables": { "id": "{{s6RunId}}" }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const run = pm.response.json().data.run;
      const polls = Number(pm.collectionVariables.get('polls') || 0);
      if (['QUEUED', 'RUNNING'].includes(run.status) && polls < Number(pm.environment.get('maxPolls'))) {
          pm.collectionVariables.set('polls', String(polls + 1));
          setTimeout(function () {}, Number(pm.environment.get('pollMs')));
          pm.execution.setNextRequest(pm.info.requestId);
      } else {
          pm.collectionVariables.set('polls', '0');
          pm.test('The check ran and reported to the team', function () {
              pm.expect(run.status, run.failureReason).to.eql('SUCCEEDED');
              const tools = run.steps.filter(s => s.kind === 'TOOL_CALL').map(s => s.toolName);
              pm.expect(tools).to.eql(['lookup_order', 'notify_team']);
          });
      }
