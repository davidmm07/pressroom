$kind: http-request
name: 6.7 Owner activates it
method: POST
url: "{{apiUrl}}/graphql"
order: 7000
headers:
  X-Pressroom-Actor: ops-lead@example.com
body:
  type: json
  content: |-
    {
      "query": "mutation ($id: ID!) { activateAgent(id: $id) { agent { status } userErrors { code message } } }",
      "variables": { "id": "{{s6AgentId}}" }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Agent is active', function () {
          pm.expect(pm.response.json().data.activateAgent.agent.status).to.eql('ACTIVE');
      });
