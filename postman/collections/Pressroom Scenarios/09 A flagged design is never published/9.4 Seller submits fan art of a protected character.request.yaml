$kind: http-request
name: 9.4 Seller submits fan art of a protected character
method: POST
url: "{{workerUrl}}/events/pubsub"
order: 4000
body:
  type: json
  content: |-
    {
      "message": {
        "messageId": "{{s9MessageId}}",
        "data": "{{s9EventData}}",
        "attributes": { "eventType": "listing.submitted" }
      },
      "subscription": "projects/local/subscriptions/pressroom-worker-push"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.collectionVariables.set('s9MessageId', 'postman-listing-flagged-' + Date.now());
      pm.collectionVariables.set('s9EventData', btoa(JSON.stringify({ listingId: 'L-3501' })));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Worker accepted the listing', function () {
          pm.response.to.have.status(200);
      });
      pm.collectionVariables.set('s9RunIds', JSON.stringify(pm.response.json().runs));
