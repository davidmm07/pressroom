name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pressroom
          POSTGRES_PASSWORD: pressroom
          POSTGRES_DB: pressroom_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pressroom"
          --health-interval 2s
          --health-retries 30
    env:
      PRESSROOM_TEST_DATABASE_URL: postgres://pressroom:pressroom@localhost:5432/pressroom_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet and formatting
        run: |
          go vet ./...
          test -z "$(gofmt -l cmd internal)" || (gofmt -l cmd internal && exit 1)
      - name: Generated GraphQL server code is current
        run: |
          cd internal/adapter/graphql && go tool gqlgen generate --config gqlgen.yml
          git diff --exit-code
      - name: Unit and integration tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./cmd/...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated client types are current
        run: pnpm codegen && git diff --exit-code -- src/gql
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Builds every image through compose, starts the stack on the sandbox model
  # and runs the Postman business scenarios against it.
  scenarios:
    needs: [go, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Start the stack
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do
            curl -fsS localhost:8080/readyz >/dev/null && curl -fsS localhost:8081/readyz >/dev/null && exit 0
            sleep 2
          done
          docker compose ps && exit 1
      - name: Run the business scenarios
        run: ./scripts/scenarios.sh
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color api worker | tail -300

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
